<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oprema</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#1b1b1b;
    font-family:Arial;
}

.container{
    width:300px;
    background:#ddd;
    padding:10px;
}

.top{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

button{
    background:#2f2f2f;
    color:white;
    border:none;
    padding:10px;
    border-radius:5px;
    cursor:pointer;
}

.search{
    width:120px;
    padding:8px;
    border:none;
    border-radius:15px;
    margin:10px 0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.item{
    height:45px;
    border:1px solid gray;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <button>Add Gear</button>
        <button>Remove Gear</button>
    </div>

    <input class="search" placeholder="Value">

    <div class="grid">
        <div class="item">Čevlji</div>
        <div class="item">Čepin</div>
        <div class="item">Nahrbtnik</div>
        <div class="item">Čelada</div>
        <div class="item">Nahrbtnik</div>
        <div class="item">Lavinska žolna</div>
    </div>

</div>

</body>
</html>
